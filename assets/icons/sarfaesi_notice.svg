<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="noticeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#FFE7B3"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background Sheet -->
  <rect x="16" y="10" width="48" height="60" rx="6" fill="url(#noticeGrad)" stroke="#F59E0B" stroke-width="2.5"/>
  <!-- Folded Corner effect -->
  <path d="M50 10 L64 24 L50 24 Z" fill="url(#foldGrad)"/>
  <path d="M50 10 L50 24 L64 24" fill="none" stroke="#D97706" stroke-width="2"/>
  <!-- Notice Header Line -->
  <rect x="24" y="22" width="20" height="4" rx="2" fill="#D97706"/>
  <!-- Text Lines -->
  <rect x="24" y="32" width="32" height="3" rx="1.5" fill="#B45309" opacity="0.65"/>
  <rect x="24" y="40" width="28" height="3" rx="1.5" fill="#B45309" opacity="0.65"/>
  <rect x="24" y="48" width="18" height="3" rx="1.5" fill="#B45309" opacity="0.65"/>
  <!-- Official Seal Badge -->
  <circle cx="51" cy="53" r="10" fill="url(#goldGrad)" stroke="#FFF" stroke-width="2"/>
  <circle cx="51" cy="53" r="7" fill="none" stroke="#FFF" stroke-width="1.2" stroke-dasharray="2 1"/>
  <!-- Checkmark / Star in seal -->
  <path d="M48 53 L50.5 55.5 L55 50" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ribbons from Seal -->
  <path d="M47 62 L45 70 L48 68 L51 70 L49 62 Z" fill="#D97706"/>
  <path d="M51 62 L53 70 L56 68 L59 70 L57 62 Z" fill="#B45309"/>
</svg>
